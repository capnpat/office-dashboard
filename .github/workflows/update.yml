name: Update data and publish

on:
  schedule:
    # Backup start only. The update job keeps itself running (see fetch/loop.py).
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Refresh every block now"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  site:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: updater
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetch/requirements.txt
      - run: pip install -r fetch/requirements.txt
      - name: Fetch data on a loop
        continue-on-error: true
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          cd fetch
          python -u loop.py ${{ (github.event.inputs.force == 'true' || github.event_name == 'push') && '--force' || '' }}
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main -R ${{ github.repository }}
